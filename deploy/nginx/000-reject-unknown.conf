# Requests for any host other than fabulka.com (a foreign domain pointed at this IP, or the bare IP)
# get no site: the connection is dropped (port 80) or the TLS handshake is refused (port 443).
# Without it the fabulka.com server block is the default and answers any Host.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

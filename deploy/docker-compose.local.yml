# Run Fabulka on your own machine with one command (no Node, pnpm or Postgres needed):
#   docker compose -f deploy/docker-compose.local.yml up --build
# then open http://localhost:3000 (admin: http://localhost:3000/admin, sign-in below).
#
# By default every model call is a canned mock: free, no key, a book in seconds.
# For the real Meta models: MODELS=meta MODEL_API_KEY=... docker compose -f deploy/docker-compose.local.yml up --build
# (the Meta Model API answers only in the regions Meta has enabled).
name: fabulka-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fabulka
      POSTGRES_PASSWORD: fabulka
      POSTGRES_DB: fabulka
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabulka"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://fabulka:fabulka@db:5432/fabulka
      STORAGE_DIR: /data/storage
      MODELS: ${MODELS:-mock}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MOCK_DELAY_MS: "300"
      MODEL_BUDGET_USD: "5"
      FREE_BOOKS: "3"
      FX_REFRESH: "off"
      GEO_BLOCK: "false"
      VOICE_INPUT: "true"
      PUBLIC_URL: http://localhost:${WEB_PORT:-3000}
      WEB_INTERNAL_URL: http://web:3000
      # Local-only admin sign-in by e-mail and password. Parent sign-in (needed only for the
      # child's-photo path) uses Keycloak and is off here; books are made without signing in.
      AUTH_SECRET: local-auth-secret
      ADMIN_PASSWORD_LOGIN: "true"
      ADMIN_EMAIL: admin@fabulka.local
      ADMIN_PASSWORD: fabulka-local-admin
      ADMIN_SECRET: local-admin-secret
      ADMIN_COOKIE_SECURE: "false"
      REVALIDATE_SECRET: local-revalidate-secret
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
      REVALIDATE_SECRET: local-revalidate-secret
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db:
  storage:

name: Images

# Builds the production images on GitHub's runners and publishes them to GHCR, so the
# server only pulls them: building on the production host is too heavy for it. CI calls this
# after its checks pass on main, so a red commit never becomes :latest.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # BUILD_ID tells open pages the web app was redeployed (apps/web/next.config.ts).
          build-args: |
            API_URL=http://api:4000
            BUILD_ID=${{ github.sha }}
          tags: |
            ghcr.io/baibesh/fabulka-${{ matrix.app }}:latest
            ghcr.io/baibesh/fabulka-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

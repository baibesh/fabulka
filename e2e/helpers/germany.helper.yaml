# Picks Germany in the footer, as a visitor would (see kazakhstan.helper.yaml: it picks on the short
# "create" page, as a tap on the footer of the long home page can miss). The site turns German.
commands:
  - openLink: "${WEB}/create"
  # The page runs in the browser (the form knows whether it starts with the voice step).
  - waitForVisible: { css: "[data-testid=book-form][data-voice=on], [data-testid=book-form][data-voice=off]", timeout: 20000 }
  - scrollUntilVisible: { testId: ui-country }
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-search }
  - inputText: "Germ"
  - waitForVisible: { testId: ui-country-option-DE }
  - tapOn: { testId: ui-country-option-DE }
  - extendedWaitUntil: { notVisible: { testId: ui-country-dialog }, timeout: 5000 }

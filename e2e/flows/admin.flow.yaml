# The admin: closed without a session, sign-in, dashboard, and the pause that stops new books.
appId: ${WEB}
tags: [smoke, admin]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
commands:
  # No session: the API refuses, the page sends you to sign in.
  - request:
      url: ${API}/admin/stats
      assert: { status: 401 }
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/ru"
  # The hero's covers render only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: hero-covers }
  - openLink: "${WEB}/admin"
  - waitForVisible: { testId: admin-login }
  - assertUrl: { equals: "${WEB}/admin/login" }

  - tapOn: { testId: admin-email }
  - inputText: "admin@e2e.test"
  - tapOn: { testId: admin-password }
  - inputText: "wrong-password"
  - tapOn: { testId: admin-submit }
  - assertVisible: "Wrong email or password"

  - tapOn: { testId: admin-password }
  - eraseText: 40
  - inputText: "e2e-admin-password"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: admin-nav-inbox }
  # The Inbox is the home page; the numbers are in Overview.
  - assertUrl: { contains: "/admin?country=all" }
  - assertVisible: { css: "[data-testid=workspace-switcher][data-value=all]" }
  - tapOn: { testId: admin-nav-overview }
  - waitForVisible: "Demand by country"

  # Pause (Settings, Generation): new books are refused until it is lifted.
  - tapOn: { testId: admin-nav-settings }
  - tapOn: { testId: settings-tab-generation }
  - waitForVisible: { testId: pause-card }
  - assertVisible: "Generation is running"
  - tapOn: { testId: pause-toggle }
  - waitForVisible: "Generation is paused"
  - request:
      method: POST
      url: ${API}/books
      headers: { X-Client-Key: e2e-admin-paused }
      json: { child: { name: Пауза, age: 5, gender: girl, interests: [мячи], city: Алматы } }
      assert: { status: 503, json: { "$.code": generation_paused } }
  # The Inbox says so first, with a link straight to the switch.
  - tapOn: { testId: admin-nav-inbox }
  - waitForVisible: { css: "[data-testid=inbox-item][data-kind=generation_paused][data-severity=danger]" }
  - assertVisible: "Book generation is paused"
  - tapOn: { css: "[data-testid=inbox-item][data-kind=generation_paused] [data-testid=inbox-fix]" }
  - waitForVisible: { css: "[data-testid=pause-card][data-paused=true]" }
  - assertUrl: { contains: "/admin/settings?tab=generation" }
  - tapOn: { testId: pause-toggle }
  - waitForVisible: "Generation is running"
  - tapOn: { testId: admin-nav-inbox }
  - waitForVisible: { css: "[data-testid=inbox-page][data-loaded=true]" }
  - assertNotVisible: { css: "[data-testid=inbox-item][data-kind=generation_paused]" }

  # The other sections open.
  - tapOn: { testId: admin-nav-books }
  - waitForVisible: { testId: books-table }
  - tapOn: { testId: admin-nav-catalog }
  - waitForVisible: { testId: catalog-table }
  - assertVisible: "Тайна снежного барса"
  - tapOn: { testId: admin-nav-orders }
  - waitForVisible: { testId: orders-table }
after:
  - sql: { exec: "delete from \"Setting\" where key = 'generation_paused'" }

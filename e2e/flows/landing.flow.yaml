# The home page sells: hero, steps, a real example book to flip through, prices. The catalog lives
# at /catalog, and the country decides the languages on offer and the currency.
appId: ${WEB}
tags: [smoke, landing]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Лендинг ${Date.now()}"
http:
  baseUrl: ${API}
  headers:
    X-Client-Key: "e2e-${childName}"
before:
  # The newest example book is the one opened on the home page.
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 5, gender: boy, interests: [динозавры], city: Астана, language: ru }
      extract: { bookId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /books/${bookId}
      retryUntil:
        status: 200
        json: { "$.status": done }
      timeout: 30000
  - sql: { exec: "update \"Book\" set featured = true where id = $1", params: ["${bookId}"] }
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  # The hero's covers render only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: hero-covers }
  - assertVisible: "Книга, где ваш ребёнок — главный герой"
  - assertVisible: { contains: "Первые книги — бесплатно, дальше — от 1 900 ₸" }
  - assertVisible: { testId: trust }
  - assertVisible: "Как это работает"
  - assertVisible: "Расскажите о ребёнке"

  # "Flip through an example" leads to the newest example book, open right on the page.
  - tapOn: { testId: hero-example }
  - waitForVisible: { testId: book-reader }
  - assertUrl: { contains: "#example" }
  # How many spreads depends on the example's theme and page layouts.
  - assertVisible: { testId: reader-position, contains: "1 / " }
  - tapOn: { testId: reader-next }
  - waitForVisible: { testId: reader-position, contains: "2 / " }

  # A tap brings the prices into view: scrolling by drag would pick up the catalog's cover links.
  - tapOn: { testId: free-books }
  - assertVisible: { text: "1 900 ₸", childOf: { testId: price-template } }
  - assertVisible: { text: "2 900 ₸", childOf: { testId: price-custom } }
  # The cheapest published format (A5) gives the "from" price.
  - assertVisible: { text: "от 6 900 ₸", childOf: { testId: price-print } }
  - tapOn: "Нужно ли регистрироваться?"
  - waitForVisible: { contains: "Книги сохраняются в вашем браузере" }
  # The FAQ is the owner's, for the visitor's country: in Kazakhstan print comes with delivery,
  # priced from the reference data.
  - assertNotVisible: { testId: faq-item-print-abroad }
  - tapOn: "Как заказать печатную книгу?"
  - waitForVisible: { contains: "Бесплатная доставка: Алматы, Астана; в другие города — 1 500 ₸" }
  - tapOn: "Сколько стоит книга?"
  - waitForVisible: { contains: "книга из каталога стоит 1 900 ₸, своя история — 2 900 ₸" }

  # The catalog has a page of its own.
  - tapOn: { testId: nav-catalog }
  - waitForVisible: { testId: template-first-day-kindergarten }
  - assertUrl: { contains: "/catalog" }
  - assertVisible: "Каталог книг"
  - assertVisible: "Тайна снежного барса"
  - assertVisible: { testId: custom-price, text: "2 900 ₸" }

  # In Uzbekistan there is no Kazakh and prices are in dollars: a Kazakh interface gives way to Russian.
  # In Kazakhstan the language dialog offers Kazakh, Russian and English.
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-kk }
  - assertVisible: { testId: ui-language-option-ru }
  - assertVisible: { testId: ui-language-option-en }
  - tapOn: { testId: ui-language-option-kk }
  - waitForVisible: "Кітаптар каталогы"
  # The country is chosen in the footer, from a dialog with a search.
  - assertVisible: { testId: ui-country, contains: "Қазақстан" }
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - assertVisible: { testId: ui-country-option-DE }
  - tapOn: { testId: ui-country-search }
  - inputText: "Өзбек"
  - assertNotVisible: { testId: ui-country-option-DE }
  - assertVisible: { testId: ui-country-option-other }
  # Found by its name in another language too.
  - eraseText
  - inputText: "uzbek"
  - waitForVisible: { testId: ui-country-option-UZ }
  - assertNotVisible: { testId: ui-country-option-KZ }
  - tapOn: { testId: ui-country-option-UZ }
  - waitForVisible: "Каталог книг"
  - assertVisible: { testId: ui-country, contains: "Узбекистан" }
  - assertVisible: { testId: custom-price, text: "$5.90" }
  - assertVisible: { testId: template-price, text: "$3.90", index: 0 }
  # The language dialog now offers Russian and English only, and a Kazakh link opens in Russian.
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-en }
  - assertNotVisible: { testId: ui-language-option-kk }
  - tapOn: { testId: ui-language-option-en }
  - waitForVisible: "Book catalog"
  - tapOn: { testId: ui-language }
  - tapOn: { testId: ui-language-option-ru }
  - waitForVisible: "Каталог книг"
  - openLink: "${WEB}/catalog?lang=kk"
  - waitForVisible: { testId: template-first-day-kindergarten }
  - assertVisible: "Каталог книг"
  - assertNotVisible: "Кітаптар каталогы"
  - tapOn: { testId: nav-home }
  - waitForVisible: { testId: hero-covers }
  - assertVisible: { contains: "Первые книги — бесплатно, дальше — от $3.90" }
  - assertVisible: "В вашей стране печати пока нет — мы планируем её открыть. А PDF легко распечатать самим."
  # Outside Kazakhstan the FAQ says print is not there yet, and prices are in dollars.
  - assertNotVisible: { contains: "доставкой по Казахстану" }
  - assertNotVisible: { testId: faq-item-print-kz }
  - assertNotVisible: { testId: faq-item-kazakh }
  - tapOn: "Можно ли заказать печатную книгу?"
  - waitForVisible: { contains: "К сожалению, в вашей стране печатные книги пока недоступны" }
  - tapOn: "Сколько стоит книга?"
  - waitForVisible: { contains: "книга из каталога стоит $3.90, своя история — $5.90" }
  - tapOn: "На каких языках можно сделать книгу?"
  - waitForVisible: { contains: "Язык книги выбирается в форме: Русский, English" }

  # Poland: English only, no tenge and no print prices anywhere; print is planned, the PDF is there.
  - tapOn: { testId: ui-country }
  - tapOn: { testId: ui-country-search }
  - inputText: "Польш"
  - waitForVisible: { testId: ui-country-option-PL }
  - tapOn: { testId: ui-country-option-PL }
  - waitForVisible: "A book where your child is the hero"
  - assertVisible: { testId: ui-country, contains: "Poland" }
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-en }
  - assertNotVisible: { testId: ui-language-option-ru }
  - assertNotVisible: { testId: ui-language-option-kk }
  - pressKey: escape
  - assertVisible: { contains: "Ready in a few minutes: read it on screen or download the PDF." }
  - assertVisible: { contains: "Your first books are free, then from $3.90" }
  # From the top of the page again (the country dialog was opened from the footer).
  - openLink: "${WEB}/"
  - waitForVisible: { testId: hero-covers }
  - assertVisible: { testId: trust, containsDescendants: { text: "Books in English" } }
  - assertVisible: { testId: trust, containsDescendants: { text: "A PDF in minutes, ready to print at home" } }
  - tapOn: { testId: free-books }
  - assertVisible: { text: "$3.90", childOf: { testId: price-template } }
  - assertVisible: { text: "Soon", childOf: { testId: price-print } }
  - assertVisible: { testId: price-print, containsDescendants: { text: "Printing isn't available in your country yet — we plan to bring it" } }
  - assertNotVisible: { contains: "₸" }
  - assertNotVisible: { testId: faq-item-print-kz }
  - tapOn: "Can I get a printed book?"
  - waitForVisible: { contains: "printed books aren't available in your country yet" }
  # The book page keeps the PDF and turns print into a request; a Russian link opens in English.
  - openLink: "${WEB}/books/${bookId}?lang=ru"
  - waitForVisible: { testId: want-print }
  - assertNotVisible: { testId: order-print }
  - assertVisible: { contains: "Printed books aren't available in your country yet" }
  - assertVisible: { testId: download-pdf }
  - assertNotVisible: { contains: "₸" }
  # The order form is not offered there either.
  - openLink: "${WEB}/books/${bookId}/order"
  - waitForVisible: { testId: order-unavailable }
  - assertNotVisible: { testId: order-form }
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }

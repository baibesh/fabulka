# Redirects in the admin's SEO section: refused for /admin, /api, /files and loops; once saved the
# site's proxy applies them at once (its cache is dropped on every change); switched off or deleted,
# the old address is a 404 again.
appId: ${WEB}
tags: [admin, seo]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
before:
  - sql: { exec: "delete from \"Redirect\" where \"from\" like '/e2e-%' or \"to\" like '/e2e-%'" }
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/admin"
  - waitForVisible: { testId: admin-login }
  - tapOn: { testId: admin-email }
  - inputText: "admin@e2e.test"
  - tapOn: { testId: admin-password }
  - inputText: "e2e-admin-password"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: pause-card }
  - tapOn: { testId: admin-nav-seo }
  - tapOn: { testId: seo-tab-redirects }
  - waitForVisible: { testId: redirect-form }

  # The admin is never redirected.
  - tapOn: { testId: redirect-from }
  - inputText: "/admin/e2e"
  - tapOn: { testId: redirect-to }
  - inputText: "/catalog"
  - tapOn: { testId: redirect-add }
  - waitForVisible: { testId: redirect-error, contains: "/admin" }

  # A real one: an old address to the German catalog.
  - tapOn: { testId: redirect-from }
  - eraseText: 30
  - inputText: "/e2e-old-catalog"
  - tapOn: { testId: redirect-to }
  - eraseText: 30
  - inputText: "/de/catalog"
  - tapOn: { testId: redirect-add }
  - waitForVisible: { testId: "redirect-row-/e2e-old-catalog" }

  # The way back would be a loop.
  - tapOn: { testId: redirect-from }
  - inputText: "/de/catalog"
  - tapOn: { testId: redirect-to }
  - inputText: "/e2e-old-catalog"
  - tapOn: { testId: redirect-add }
  - waitForVisible: { testId: redirect-error }
  - assertNotVisible: { testId: "redirect-row-/de/catalog" }
  - sql:
      query: "select count(*)::int as n from \"Redirect\" where \"from\" like '/e2e-%'"
      readOnly: true
      assert: { first: { n: 1 } }

  # The site follows it at once (a 301 on the server, the query kept).
  - request: { url: "${WEB}/e2e-old-catalog?from=e2e", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "Buchkatalog"] }
  - openLink: "${WEB}/e2e-old-catalog"
  - waitForVisible: "Buchkatalog"
  - assertUrl: { equals: "${WEB}/de/catalog" }

  # Switched off: the old address is a 404 again at once (asked from the server: the browser keeps a
  # 301 it has seen, as browsers do).
  - openLink: "${WEB}/admin/seo?tab=redirects"
  - waitForVisible: { testId: "redirect-row-/e2e-old-catalog" }
  - tapOn: { testId: redirect-toggle }
  - waitForVisible: { testId: redirect-toggle, checked: false }
  - sql:
      query: "select active from \"Redirect\" where \"from\" = '/e2e-old-catalog'"
      readOnly: true
      assert: { first: { active: false } }
  - request: { url: "${WEB}/e2e-old-catalog", assert: { status: 404 } }
  # Every change is in the history.
  - openLink: "${WEB}/admin/seo?tab=redirects"
  - waitForVisible: { testId: "redirect-row-/e2e-old-catalog" }
  - tapOn: { testId: redirect-delete }
  - assertNotVisible: { testId: "redirect-row-/e2e-old-catalog" }
  - sql:
      query: "select count(*)::int as n from \"SeoHistory\" where kind = 'redirect' and who = 'admin@e2e.test' and (before->>'from' = '/e2e-old-catalog' or after->>'from' = '/e2e-old-catalog')"
      readOnly: true
      assert: { first: { n: 3 } }
after:
  - sql: { exec: "delete from \"SeoHistory\" where kind = 'redirect' and (before->>'from' like '/e2e-%' or after->>'from' like '/e2e-%')" }
  - sql: { exec: "delete from \"Redirect\" where \"from\" like '/e2e-%' or \"to\" like '/e2e-%'" }

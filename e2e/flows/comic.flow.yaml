# A comic, made end to end (mock models): the parent picks the comic quest for a 10-year-old and gets
# a comic, not a picture book - the comic theme, pages of panels with speech balloons, a caption box
# and a sound word in the reader, the side character Ayla drawn on a sheet of her own and chained like
# the hero. Each frame is drawn and read by SAM (faces too, for the balloons) on its own, and the
# journal links every call to its pipeline step, page and frame. The PDF prints.
appId: ${WEB}
tags: [book, comic]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Comic ${Date.now()}"
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/create"
  - runFlow: ../helpers/fill-by-hand.helper.yaml
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - selectOption: { testId: child-age, option: "10" }
  - tapOn: { testId: child-interests }
  - inputText: "kites, maps"
  - tapOn: { testId: wizard-next }
  # The hero's look: by description, as picked (nothing), then on.
  - waitForVisible: { css: "[data-step=look]" }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { css: "[data-step=story]" }
  - selectOption: { testId: book-methodology, optionValue: comic-quest }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { css: "[data-step=toy]" }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { testId: wizard-review }
  - assertVisible: { text: "Comic quest" }
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "The book is ready", timeout: 60000 }
  - waitForVisible: { testId: book-reader }
  # The first spread after the cover: page 1 of the comic, its panels, balloons, caption and sound.
  - tapOn: { testId: reader-next }
  - waitForVisible: { css: "[data-testid=book-reader] .fb-page[data-key=story-1].fb-panels" }
  - assertVisible: { css: "[data-key=story-1] .fb-panel[data-frame='3']" }
  - assertVisible: { css: "[data-key=story-1] .fb-say[data-el='1:1.2'] p", contains: "Look what I found!" }
  - assertVisible: { css: "[data-key=story-1] .fb-caption p", contains: "Part 1." }
  - assertVisible: { css: "[data-key=story-1] .fb-sfx p", contains: "BOOM!" }
  - assertVisible: { css: "[data-key=story-1] .fb-balloons ellipse" }
  - sql:
      query: >-
        select id, status::text as status, "storyFormat" as format, methodology, layout->'theme'->>'id' as theme,
        jsonb_array_length(pages) as pages, jsonb_array_length(pages->0->'frames') as frames,
        pages->0->'texts'->1->>'kind' as kind, pages->0->'texts'->1->>'speaker' as speaker,
        "cast"->0->>'imagePath' is not null as sheet, "cast"->1->>'imagePath' is null as thing,
        (layout->'pages'->'1'->>'panels')::boolean as panels, "pdfPath" is not null as pdf
        from "Book" where child->>'name' = $1
      params: ["${childName}"]
      readOnly: true
      extract: { bookId: "$[0].id" }
      assert:
        rows: 1
        first:
          { status: done, format: comic, methodology: comic-quest, theme: comic, pages: 8, frames: 3, kind: speech,
            speaker: hero, sheet: true, thing: true, panels: true, pdf: true }
  # Every frame drawn once and read by SAM with three concepts (people, animals, faces), by step, page and frame.
  - sql:
      query: >-
        select count(*) filter (where step = 'frame.draw' and kind = 'page' and page = 1 and frame = 3)::int as drawn,
        count(*) filter (where step = 'frame.mask' and page = 1 and frame = 1)::int as masks,
        count(*) filter (where step = 'sheet.cast' and kind = 'cast')::int as cast,
        count(*) filter (where step = 'story.write')::int as story,
        count(*) filter (where step = 'cover.draw')::int as cover
        from "ModelCall" where "bookId" = $1
      params: ["${bookId}"]
      readOnly: true
      assert:
        first: { drawn: 1, masks: 3, cast: 1, story: 1, cover: 1 }
  - request:
      url: ${API}/books/${bookId}
      extract: { pdfUrl: "$.pdfUrl", frameUrl: "$.pages[0].frames[2].imageUrl" }
      assert:
        status: 200
        json: { "$.format": comic, "$.pages[0].grid": big-top-2, "$.pages[0].texts[0].kind": caption }
  - request:
      url: ${WEB}${frameUrl}
      assert: { status: 200 }
  - request:
      url: ${WEB}${pdfUrl}
      assert:
        status: 200
        headers: { content-type: application/pdf }
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }

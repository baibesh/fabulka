# In the browser: after three free books the paywall appears; the demo checkout unlocks one more
# at the price of a story of your own.
appId: ${WEB}
tags: [smoke, limits]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Пейвол ${Date.now()}"
before:
  - launchApp: { appId: "${WEB}", clearState: true }
  # The test browser's address has no country: the visitor picks Kazakhstan (tenge, print).
  - runFlow: ../helpers/kazakhstan.helper.yaml
  - openLink: "${WEB}/ru"
  # The hero's covers render only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: hero-covers }
  - openLink: "${WEB}/ru/create"
commands:
  - repeat:
      times: 3
      commands:
        - openLink: "${WEB}/ru/create"
        - runFlow: ../helpers/fill-by-hand.helper.yaml
        - tapOn: { testId: child-name }
        - inputText: "${childName}"
        - tapOn: { testId: child-interests }
        - inputText: "мячи"
        - tapOn: { testId: wizard-next }
        # The hero's look: by description, as picked (nothing), then on.
        - tapOn: { testId: wizard-next }
        - tapOn: { testId: wizard-next }
        - tapOn: { testId: wizard-next }
        # The quota line sits next to the button that spends it.
        - waitForVisible: { testId: quota, contains: "Бесплатных книг осталось:" }
        - tapOn: { testId: create-book }
        - waitForVisible: { testId: book-status }
  - openLink: "${WEB}/ru/create"
  - runFlow: ../helpers/fill-by-hand.helper.yaml
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - tapOn: { testId: child-interests }
  - inputText: "мячи"
  - tapOn: { testId: wizard-next }
  # The hero's look: by description, as picked (nothing), then on.
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { text: "Бесплатных книг осталось: 0 из 3" }
  - tapOn: { testId: create-book }
  - waitForVisible: { testId: paywall }
  - assertVisible: { contains: "Бесплатные книги закончились" }
  # A story of your own is the dearer kind, and the checkout records it at that price.
  - assertVisible: { testId: buy-book, contains: "2 900 ₸" }
  # The receipt's address is optional; one typed here goes along with the purchase.
  - tapOn: { testId: paywall-email }
  - inputText: "pay+${Date.now()}@e2e.test"
  - tapOn: { testId: buy-book }
  - waitForVisible: { text: "Книга готова", timeout: 30000 }
  - sql:
      query: >-
        select count(*)::int as books from "Book" where child->>'name' = $1
      params: ["${childName}"]
      readOnly: true
      assert:
        first: { books: 4 }
  - sql:
      query: >-
        select sum(amount)::int as paid, min(currency) as currency from "Credit"
        where "clientKey" in (select "clientKey" from "Book" where child->>'name' = $1)
      params: ["${childName}"]
      readOnly: true
      assert:
        first: { paid: 290000, currency: KZT }
after:
  - sql:
      exec: >-
        delete from "Credit" where "clientKey" in (select "clientKey" from "Book" where child->>'name' = $1)
      params: ["${childName}"]
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }

# Language in the address: English, the default, unprefixed; the other languages under /ru, /kk,
# /es, /de; /en and old ?lang= links redirect; an unknown language is a 404. The language picker keeps
# the page, the preference only offers (never redirects, crawlers included); canonical and hreflang
# tags, the sitemap and robots.txt; with no country cookie the first HTML is for the visitor's IP
# country, else "other"; the country cookie gives the right prices in the very first HTML and
# survives a reload; sign-in and sign-out come back to the page with its prefix.
appId: ${WEB}
tags: [smoke, i18n, seo]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  SITE: https://fabulka.com
  email: "routing+${Date.now()}@e2e.test"
  # Addresses in the DB-IP country database: Kazakhstan, Germany, Brazil (not listed: "other").
  IP_KZ: 2.72.0.1
  IP_DE: 5.9.0.1
  IP_BR: 177.0.0.1
commands:
  # The server renders each language at its own address, with canonical and hreflang links.
  - request: { url: "${WEB}/ru/catalog", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "<html lang=\"ru\""] }
  - assertTrue: { contains: ["${response.body}", "Каталог книг"] }
  - assertTrue: { contains: ["${response.body}", "<link rel=\"canonical\" href=\"${SITE}/ru/catalog\"/>"] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"en\" href=\"${SITE}/catalog\""] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"kk\" href=\"${SITE}/kk/catalog\""] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"es\" href=\"${SITE}/es/catalog\""] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"de\" href=\"${SITE}/de/catalog\""] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"x-default\" href=\"${SITE}/catalog\""] }
  - request: { url: "${WEB}/catalog/bath-time", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "<html lang=\"en\""] }
  - assertTrue: { contains: ["${response.body}", "<link rel=\"canonical\" href=\"${SITE}/catalog/bath-time\"/>"] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"ru\" href=\"${SITE}/ru/catalog/bath-time\""] }
  - assertTrue: { contains: ["${response.body}", "hrefLang=\"x-default\" href=\"${SITE}/catalog/bath-time\""] }
  # The catalog book itself is in the first HTML, in the address's language.
  - request: { url: "${WEB}/es/catalog/bath-time", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "¡Chap, chap, a la bañera!"] }
  # Family pages stay out of search.
  - request: { url: "${WEB}/my", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "<meta name=\"robots\" content=\"noindex, nofollow\"/>"] }

  # No country cookie: the first HTML is for the country of the visitor's address, never assumed to
  # be Kazakhstan. This browser's (local) address and a country the site does not list give "other",
  # dollars and only the books listed everywhere.
  - request: { url: "${WEB}/catalog", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">$5.90<"] }
  - evalScript: "output.page = http.get(WEB + '/catalog').body"
  - assertTrue: '${!output.page.includes("The Secret of the Snow Leopard") && !output.page.includes("₸<")}'
  - request: { url: "${WEB}/catalog", headers: { X-Real-IP: "${IP_BR}" }, assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">$5.90<"] }
  # Tenge, written the English way on the English page.
  - request: { url: "${WEB}/catalog", headers: { X-Real-IP: "${IP_KZ}" }, assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">₸2,900<"] }
  - assertTrue: { contains: ["${response.body}", "The Secret of the Snow Leopard"] }
  # Euros, written the German way on the German page.
  - request: { url: "${WEB}/de/catalog", headers: { X-Real-IP: "${IP_DE}" }, assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">5,90\u00a0€<"] }
  - assertTrue: { contains: ["${response.body}", "Der erste Tag in der Kita"] }
  # A crawler gets the same: no redirect by Accept-Language, the English page for "other".
  - request:
      url: "${WEB}/"
      headers: { User-Agent: "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)", Accept-Language: "ru-RU,ru;q=0.9" }
      assert: { status: 200 }
  - assertTrue: { contains: ["${response.body}", "<html lang=\"en\""] }
  - assertTrue: { contains: ["${response.body}", "$3.90"] }
  - evalScript: "output.page = http.get(WEB + '/', { headers: { 'User-Agent': 'Googlebot/2.1', 'Accept-Language': 'ru' } }).body"
  - assertTrue: '${output.page.includes("<html lang=\"en\"") && !output.page.includes("₸")}'

  # The country cookie: the very first HTML has Germany's prices and Germany's catalog, whatever the
  # address says.
  - request: { url: "${WEB}/de/catalog", headers: { Cookie: "fabulka_country=DE", X-Real-IP: "${IP_KZ}" }, assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">5,90\u00a0€<"] }
  - assertTrue: { contains: ["${response.body}", "Der erste Tag in der Kita"] }
  # The language in the address wins even where the country does not offer it.
  - request: { url: "${WEB}/kk/catalog", headers: { Cookie: "fabulka_country=DE" }, assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "Кітаптар каталогы"] }
  - assertTrue: { contains: ["${response.body}", "data-testid=\"custom-price\">5,90\u00a0€<"] }

  # The sitemap: every public page in every language, with hreflang alternates.
  - request: { url: "${WEB}/sitemap.xml", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "<loc>${SITE}/kk/catalog/bath-time</loc>"] }
  - assertTrue: { contains: ["${response.body}", "<loc>${SITE}/catalog/bath-time</loc>"] }
  - assertTrue: { contains: ["${response.body}", "<loc>${SITE}/ru/catalog/bath-time</loc>"] }
  - assertTrue: { contains: ["${response.body}", "<loc>${SITE}/de/privacy</loc>"] }
  - evalScript: "output.sitemap = http.get(WEB + '/sitemap.xml').body"
  - assertTrue: '${!output.sitemap.includes(SITE + "/en/")}'
  - assertTrue: { contains: ["${response.body}", "hreflang=\"x-default\" href=\"${SITE}/catalog/bath-time\""] }
  - assertTrue: { contains: ["${response.body}", "hreflang=\"ru\" href=\"${SITE}/ru/catalog/bath-time\""] }
  - assertTrue: { contains: ["${response.body}", "hreflang=\"es\" href=\"${SITE}/es/catalog/bath-time\""] }
  # robots.txt: the admin and family pages are off limits, the sitemap is named.
  - request: { url: "${WEB}/robots.txt", assert: { status: 200 } }
  - assertTrue: { contains: ["${response.body}", "Disallow: /admin"] }
  - assertTrue: { contains: ["${response.body}", "Disallow: /my\n"] }
  - assertTrue: { contains: ["${response.body}", "Disallow: /ru/my"] }
  - assertTrue: { contains: ["${response.body}", "Disallow: /kk/orders/"] }
  - evalScript: "output.robots = http.get(WEB + '/robots.txt').body"
  - assertTrue: '${!output.robots.includes("Disallow: /en/")}'
  - assertTrue: { contains: ["${response.body}", "Sitemap: ${SITE}/sitemap.xml"] }

  # Redirects: /en goes to the unprefixed address, an old ?lang= link to its language's address.
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/en/catalog?x=1"
  - waitForVisible: "Book catalog"
  - assertUrl: { equals: "${WEB}/catalog?x=1" }
  - openLink: "${WEB}/catalog?lang=kk"
  - waitForVisible: "Кітаптар каталогы"
  - assertUrl: { equals: "${WEB}/kk/catalog" }
  - openLink: "${WEB}/catalog?lang=ru"
  - waitForVisible: "Каталог книг"
  - assertUrl: { equals: "${WEB}/ru/catalog" }
  - openLink: "${WEB}/ru/catalog?lang=en"
  - waitForVisible: "Book catalog"
  - assertUrl: { equals: "${WEB}/catalog" }
  # An unknown language is not a prefix: a 404, in English.
  - openLink: "${WEB}/fr/catalog"
  - waitForVisible: "This page doesn't exist. Maybe it hasn't been written yet?"

  # The picker goes to the same page in the other language, and back to the unprefixed English one.
  # It lists English first.
  - openLink: "${WEB}/kk/catalog/bath-time"
  - waitForVisible: { testId: template-title }
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-en }
  - assertVisible: { css: "li:first-child > [data-testid=ui-language-option-en]" }
  - tapOn: { testId: ui-language-option-ru }
  - waitForVisible: { testId: template-title, text: "Буль-буль, купаемся!" }
  - assertUrl: { equals: "${WEB}/ru/catalog/bath-time" }
  - assertVisible: { testId: nav-catalog }
  # The preference never redirects: the English address stays English, with an offer of Russian.
  - openLink: "${WEB}/catalog"
  - waitForVisible: { testId: locale-suggest }
  - assertUrl: { equals: "${WEB}/catalog" }
  - assertVisible: "Book catalog"
  - assertVisible: { testId: locale-suggest-open, contains: "Открыть на русском" }
  - tapOn: { testId: locale-suggest-open }
  - waitForVisible: "Каталог книг"
  - assertUrl: { equals: "${WEB}/ru/catalog" }
  - tapOn: { testId: ui-language }
  - tapOn: { testId: ui-language-option-en }
  - waitForVisible: "Book catalog"
  - assertUrl: { equals: "${WEB}/catalog" }
  - assertNotVisible: { testId: locale-suggest }

  # The country lives in a cookie: picked once, it is there after a reload, prices included.
  - openLink: "${WEB}/de/catalog"
  - waitForVisible: "Buchkatalog"
  # A tap before the page has hydrated opens nothing: tap again until the dialog is there.
  - retry:
      maxRetries: 4
      commands:
        - tapOn: { testId: ui-country }
        - waitForVisible: { testId: ui-country-search, timeout: 3000 }
  - tapOn: { testId: ui-country-search }
  - inputText: "Deutschland"
  - tapOn: { testId: ui-country-option-DE }
  - waitForVisible: { testId: ui-country, contains: "Deutschland" }
  - openLink: "${WEB}/de/catalog"
  - waitForVisible: { testId: custom-price, text: "5,90 €" }
  - assertVisible: { testId: ui-country, contains: "Deutschland" }
  - assertVisible: "Der erste Tag in der Kita"
  - assertNotVisible: "Das Geheimnis des Schneeleoparden"
  # Sign-in and sign-out come back to the page, prefix included.
  - openLink: "${WEB}/ru/catalog"
  - waitForVisible: { testId: auth-login }
  - tapOn: { testId: auth-login }
  - waitForVisible: { testId: mock-login-email, timeout: 10000 }
  - tapOn: { testId: mock-login-email }
  - inputText: "${email}"
  - tapOn: { testId: mock-login-submit }
  - waitForVisible: { testId: auth-account, timeout: 15000 }
  - assertUrl: { equals: "${WEB}/ru/catalog" }
  - assertVisible: "Каталог книг"
  - tapOn: { testId: auth-account }
  - tapOn: { testId: auth-logout }
  - waitForVisible: { testId: auth-login, timeout: 15000 }
  - assertUrl: { equals: "${WEB}/ru/catalog" }
after:
  - sql: { exec: "delete from \"User\" where sub = $1", params: ["mock:${email}"] }

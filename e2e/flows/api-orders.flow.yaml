# An order holds a name and an address: only the browser that made the book can order it or see it.
# The parent gets a confirmation email (kept in memory by the API without RESEND_API_KEY). Print is
# ordered only from a country with print: the one chosen on the site (X-Country), else the IP's,
# else "other" (no print). The steps order from Kazakhstan unless they say otherwise.
device: none
env:
  childName: "Owner ${Date.now()}"
  owner: "e2e-owner-${Date.now()}"
  stranger: "e2e-stranger-${Date.now()}"
  parentEmail: "order-${Date.now()}@e2e.test"
http:
  baseUrl: ${API}
  headers:
    X-Country: KZ
commands:
  - request:
      method: POST
      url: /books
      headers: { X-Client-Key: "${owner}" }
      json: { child: { name: "${childName}", age: 6, gender: girl, interests: [мячи], city: Алматы } }
      extract: { bookId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /books/${bookId}
      retryUntil: { status: 200, json: { "$.status": done } }
      timeout: 30000
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${stranger}" }
      json: { bookId: "${bookId}", recipientName: Чужой, phone: "+77011234567", email: "${parentEmail}", cityId: almaty, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 404 }
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "${parentEmail}", cityId: almaty, address: "ул. Абая, 1", cover: soft, quantity: 1, locale: kk }
      extract: { orderId: "$.id" }
      # Almaty has free delivery: the copy only, and the order keeps the city's id and Russian name.
      assert: { status: 201, json: { "$.totalKzt": 9900, "$.deliveryKzt": 0, "$.cityId": almaty, "$.city": Алматы } }
  # Shymkent pays the flat delivery fee.
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "other-${parentEmail}", cityId: shymkent, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 201, json: { "$.totalKzt": 11400, "$.deliveryKzt": 1500, "$.city": Шымкент } }
  # Only to a city on the owner's list.
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "other-${parentEmail}", cityId: tirana, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 400, json: { "$.code": city_unknown } }
  # Poland and "another country" have no print: refused, whatever the city.
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}", X-Country: PL }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "${parentEmail}", cityId: almaty, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 400, json: { "$.code": print_unavailable } }
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}", X-Country: other }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "${parentEmail}", cityId: almaty, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 400, json: { "$.code": print_unavailable } }
  - request:
      url: /orders/${orderId}
      headers: { X-Client-Key: "${stranger}" }
      assert: { status: 404 }
  - request:
      url: /orders/${orderId}
      headers: { X-Client-Key: "${owner}" }
      assert: { status: 200, json: { "$.recipientName": Айгерим } }
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Айгерим, phone: "+77011234567", email: "not-an-email", cityId: almaty, address: "ул. Абая, 1", cover: soft, quantity: 1 }
      assert: { status: 400 }
  - request:
      url: /test/mails
      query: { to: "${parentEmail}" }
      retryUntil: { status: 200, json: { "$[0].subject": { contains: "тапсырыс қабылданды" } } }
      extract: { mailText: "$[0].text" }
      timeout: 5000
  - assertTrue: { contains: ["${mailText}", "/kk/orders/${orderId}"] }
  # A German-speaking parent gets the confirmation in German.
  - request:
      method: POST
      url: /orders
      headers: { X-Client-Key: "${owner}" }
      json: { bookId: "${bookId}", recipientName: Anna, phone: "+77011234567", email: "de-${parentEmail}", cityId: almaty, address: "ул. Абая, 1", cover: hard, quantity: 2, locale: de }
      extract: { germanOrderId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /test/mails
      query: { to: "de-${parentEmail}" }
      retryUntil: { status: 200, json: { "$[0].subject": { contains: "eingegangen" } } }
      extract: { germanMail: "$[0].text" }
      timeout: 5000
  - assertTrue: { contains: ["${germanMail}", "2 Exemplare"] }
  - assertTrue: { contains: ["${germanMail}", "/de/orders/${germanOrderId}"] }

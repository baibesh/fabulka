# The admin's language: English by default (<html lang="en">, whatever language the site was
# visited in), the flag picker in the sidebar (the site's language dialog, offering all five
# languages, English first and Russian last) turns it to Russian, German and Spanish and back, and
# the choice is kept.
appId: ${WEB}
tags: [admin, i18n]
commands:
  # The server renders the admin in English.
  - request:
      url: ${WEB}/admin/login
      assert: { status: 200 }
  - assertTrue: { contains: ["${response.body}", "<html lang=\"en\""] }
  - assertTrue: { contains: ["${response.body}", "<title>Admin — Fabulka</title>"] }

  # A fresh browser that saw the Russian site first still gets the admin in English.
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/ru"
  # The hero's covers render only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: hero-covers }
  - openLink: "${WEB}/admin"
  - waitForVisible: { testId: admin-login }
  - assertVisible: "Admin sign-in"
  - tapOn: { testId: admin-email }
  - inputText: "admin@e2e.test"
  - tapOn: { testId: admin-password }
  - inputText: "e2e-admin-password"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: pause-card }
  - assertVisible: { testId: admin-nav-books, text: "Books" }
  - assertVisible: { testId: admin-nav-journal, text: "Journal" }
  - assertVisible: "Generation is running"
  - assertVisible: { css: "html[lang=en] [data-testid=admin-nav-books]" }

  # The picker lists English first and Russian last.
  - tapOn: { testId: admin-language }
  - waitForVisible: { testId: admin-lang-en }
  - assertVisible: { css: "[data-testid=admin-language-dialog] li:first-child > [data-testid=admin-lang-en]" }
  - assertVisible: { css: "[data-testid=admin-language-dialog] li:nth-child(2) > [data-testid=admin-lang-kk]" }
  - assertVisible: { css: "[data-testid=admin-language-dialog] li:last-child > [data-testid=admin-lang-ru]" }

  # Russian: the nav and the page switch at once, and so does <html lang>.
  - tapOn: { testId: admin-lang-ru }
  - waitForVisible: { testId: admin-nav-books, text: "Книги" }
  - assertVisible: { testId: admin-nav-dashboard, text: "Дашборд" }
  - assertVisible: "Генерация работает"
  - assertVisible: { css: "html[lang=ru] [data-testid=admin-nav-books]" }
  - tapOn: { testId: admin-nav-orders }
  - waitForVisible: { testId: orders-table }
  - assertVisible: "Заказы печати"

  # The choice is kept: another admin page opened afresh stays in Russian.
  - openLink: "${WEB}/admin/books"
  - waitForVisible: { testId: books-table }
  - assertVisible: { testId: admin-nav-books, text: "Книги" }

  # German and Spanish too.
  - tapOn: { testId: admin-language }
  - tapOn: { testId: admin-lang-de }
  - waitForVisible: { testId: admin-nav-books, text: "Bücher" }
  - assertVisible: { testId: admin-nav-journal, text: "Protokoll" }
  - tapOn: { testId: admin-nav-orders }
  - waitForVisible: "Druckbestellungen"
  - tapOn: { testId: admin-language }
  - tapOn: { testId: admin-lang-es }
  - waitForVisible: "Pedidos de impresión"
  - assertVisible: { testId: admin-nav-books, text: "Libros" }

  # Back to English.
  - tapOn: { testId: admin-language }
  - tapOn: { testId: admin-lang-en }
  - waitForVisible: { testId: admin-nav-books, text: "Books" }
  - assertVisible: { testId: admin-nav-dashboard, text: "Dashboard" }
  - assertNotVisible: { text: "Книги" }

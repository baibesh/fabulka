# The picture book stays as it was under story formats (mock models): a new book is a picture book
# page by page - one full frame and one narration, laid out with the theme's variants, never as
# panels - and a book made before formats (its pages in the old shape, written straight to the
# database) is read through the adapter: one full frame and its narration, shown in the reader as
# before, with its text where it always was.
appId: ${WEB}
tags: [book, comic]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  stamp: "${Date.now()}"
  childName: "Picture ${stamp}"
  oldId: "oldfmt${stamp}"
http:
  baseUrl: ${API}
  headers:
    X-Client-Key: "e2e-picture-format-${stamp}"
before:
  - sql:
      exec: >-
        insert into "Book" (id, status, progress, child, language, methodology, title, pages, "talkQuestions", "clientKey", "createdAt", "updatedAt")
        values ($1, 'done', 100, '{"name":"Old ${stamp}","age":6,"gender":"boy","interests":["mountains"],"city":"Almaty","language":"en"}',
        'en', 'adventure-quest', 'An old book',
        '[{"page":1,"beat":1,"text":"Timur woke up early and looked at the mountains.","scenePrompt":"the hero at the window","imagePath":null},
          {"page":2,"text":"Then he went out to play.","scenePrompt":"the hero in the yard","imagePath":null,"art":"refused"}]',
        '["What did you see?"]', 'e2e-picture-format-old', now(), now())
      params: ["${oldId}"]
commands:
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 6, gender: boy, interests: [trains], city: Almaty, language: en }
      extract: { bookId: "$.id" }
      assert: { status: 201, json: { "$.format": picture-book } }
  - request:
      url: /books/${bookId}
      retryUntil:
        status: 200
        json: { "$.status": done }
      timeout: 30000
  - request:
      url: /books/${bookId}
      assert:
        json:
          { "$.pages[0].grid": full, "$.pages[0].texts[0].kind": narration, "$.pages[0].frames[0].rect.w": 1, "$.layout.panels": null,
            "$.layout.pages['1'].panels": false }
  # Every page: one frame, one narration.
  - sql:
      query: >-
        select bool_and(jsonb_array_length(p->'frames') = 1 and jsonb_array_length(p->'texts') = 1) as one
        from "Book", jsonb_array_elements(pages) p where id = $1
      params: ["${bookId}"]
      readOnly: true
      assert: { first: { one: true } }
  - sql:
      query: >-
        select count(*) filter (where step = 'frame.draw' and frame = 1)::int as drawn,
        count(*) filter (where step = 'frame.mask')::int as masks,
        count(*) filter (where kind = 'cast')::int as cast
        from "ModelCall" where "bookId" = $1
      params: ["${bookId}"]
      readOnly: true
      # Four pages, one picture each, read by SAM twice (people, animals: no faces without balloons).
      assert: { first: { drawn: 4, masks: 8, cast: 0 } }

  # A book made before formats: read through the adapter.
  - request:
      url: /books/${oldId}
      assert:
        status: 200
        json:
          { "$.format": picture-book, "$.pages[0].text": "Timur woke up early and looked at the mountains.",
            "$.pages[0].grid": full, "$.pages[0].frames[0].frame": 1, "$.pages[0].frames[0].rect.h": 1,
            "$.pages[0].texts[0].id": "1.1", "$.pages[0].texts[0].kind": narration, "$.pages[1].vignette": true,
            "$.pages[1].frames[0].vignette": true }
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/books/${oldId}"
  - waitForVisible: { testId: book-reader }
  - tapOn: { testId: reader-next }
  - waitForVisible: { css: "[data-testid=book-reader] .fb-page[data-key=story-1]:not(.fb-panels)" }
  - assertVisible: { css: "[data-key=story-1] .fb-text p", contains: "Timur woke up early" }
  - assertNotVisible: { css: "[data-testid=book-reader] .fb-panel" }
after:
  - sql: { exec: "delete from \"Book\" where \"clientKey\" in ($1, 'e2e-picture-format-old')", params: ["e2e-picture-format-${stamp}"] }

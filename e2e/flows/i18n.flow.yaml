# Interface language and country: the language button in the header and the country button in the
# footer, each opening a dialog; the catalog in Kazakh, English, German and Spanish (the books about
# Kazakhstan listed there only), print offered only in Kazakhstan, and a book written in Spanish.
appId: ${WEB}
tags: [smoke, i18n]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Lang ${Date.now()}"
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/?lang=ru"
  # The hero's covers render only after hydration, when the switches start working.
  - waitForVisible: { testId: hero-covers }
  - assertVisible: "Книга, где ваш ребёнок — главный герой"

  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-kk }
  - tapOn: { testId: ui-language-option-kk }
  - waitForVisible: "Балаңыз басты кейіпкер болатын кітап"
  - assertNotVisible: { testId: ui-language-option-kk }
  - assertVisible: { testId: ui-language, contains: "ҚАЗ" }
  - tapOn: { testId: nav-catalog }
  - waitForVisible: "Ақ барыстың құпиясы"
  # The dialog closes on Esc without changing anything.
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-en }
  - pressKey: escape
  - assertNotVisible: { testId: ui-language-option-en }
  - assertVisible: "Ақ барыстың құпиясы"
  - tapOn: { testId: ui-language }
  - tapOn: { testId: ui-language-option-en }
  - waitForVisible: "The Secret of the Snow Leopard"

  # A book made while the interface is in English defaults to an English book.
  - tapOn: { testId: nav-create }
  - tapOn: { testId: voice-manual, contains: "Fill in by hand" }
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - tapOn: { testId: child-interests }
  - inputText: "space"
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { testId: wizard-review }
  - assertVisible: { text: "English" }
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "The book is ready", timeout: 30000 }
  - assertVisible: { contains: "${childName} and the Starry Journey" }
  - assertVisible: { testId: order-print }

  # Outside Kazakhstan the PDF stays, print turns into a request.
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-option-other }
  - waitForVisible: { testId: ui-country, contains: "Another country" }
  - waitForVisible: { testId: want-print }
  - assertNotVisible: { testId: order-print }
  - tapOn: { testId: want-print }
  - waitForVisible: { testId: want-print-thanks }
  - sql:
      query: >-
        select count(*)::int as requests from "PrintInterest" p join "Book" b on b.id = p."bookId"
        where b.child->>'name' = $1
      params: ["${childName}"]
      readOnly: true
      assert:
        first: { requests: 1 }

  # Another country offers English, Spanish, German and Russian, never Kazakh.
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-es }
  - assertVisible: { testId: ui-language-option-de }
  - assertVisible: { testId: ui-language-option-ru }
  - assertNotVisible: { testId: ui-language-option-kk }
  - tapOn: { testId: ui-language-option-ru }
  - openLink: "${WEB}/catalog"
  - waitForVisible: "Каталог книг"

  # Germany speaks German and English: a Russian interface gives way to German.
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-search }
  - inputText: "Герм"
  - waitForVisible: { testId: ui-country-option-DE }
  - tapOn: { testId: ui-country-option-DE }
  - waitForVisible: "Buchkatalog"
  # The books about Kazakhstan are listed there only.
  - waitForVisible: "Der erste Tag in der Kita"
  - assertNotVisible: "Das Geheimnis des Schneeleoparden"
  - assertVisible: { testId: ui-country, contains: "Deutschland" }
  - assertVisible: { testId: ui-language, contains: "DE" }
  - assertVisible: { testId: custom-price, text: "$5.90" }
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-de }
  - assertVisible: { testId: ui-language-option-en }
  - assertNotVisible: { testId: ui-language-option-ru }
  - assertNotVisible: { testId: ui-language-option-es }
  - assertNotVisible: { testId: ui-language-option-kk }
  - pressKey: escape
  - tapOn: { testId: nav-home }
  - waitForVisible: "Ein Buch, in dem dein Kind der Held ist"
  - tapOn: "In welchen Sprachen gibt es die Bücher?"
  - waitForVisible: { contains: "Die Sprache des Buches wählst du im Formular: Deutsch, English" }

  # Spain: Spanish and English; a German interface gives way to Spanish.
  - openLink: "${WEB}/catalog"
  - waitForVisible: "Buchkatalog"
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-search }
  - inputText: "Spanien"
  - waitForVisible: { testId: ui-country-option-ES }
  - tapOn: { testId: ui-country-option-ES }
  - waitForVisible: "Catálogo de libros"
  - waitForVisible: "El primer día en la guardería"
  - assertVisible: { testId: ui-country, contains: "España" }
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-es }
  - assertVisible: { testId: ui-language-option-en }
  - assertNotVisible: { testId: ui-language-option-de }
  - pressKey: escape
  - tapOn: { testId: nav-home }
  - waitForVisible: "Un libro en el que tu hijo es el protagonista"
  - tapOn: "¿Cuánto cuesta un libro?"
  - waitForVisible: { contains: "$3.90" }

  # A book made in the Spanish interface is written in Spanish.
  - tapOn: { testId: nav-create }
  - tapOn: { testId: voice-manual, contains: "Rellenar a mano" }
  - tapOn: { testId: child-name }
  - inputText: "${childName} ES"
  - tapOn: { testId: child-interests }
  - inputText: "dinosaurios"
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - waitForVisible: { testId: wizard-review }
  - assertVisible: { text: "Español" }
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "El libro está listo", timeout: 30000 }
  - assertVisible: { contains: "${childName} ES y el viaje de las estrellas" }
  - assertVisible: { testId: want-print }
  - sql:
      query: >-
        select child->>'language' as language from "Book" where child->>'name' = $1
      params: ["${childName} ES"]
      readOnly: true
      assert:
        first: { language: es }
  # A book page opened straight in a language other than the server's Russian (a shared link, a
  # reload): it used to stay on «Загружаем…» because the params promise never resolved on the client.
  - openLink: "${WEB}/catalog/first-day-kindergarten"
  - waitForVisible: { testId: template-title, timeout: 15000 }
  - assertNotVisible: { text: "Загружаем…" }
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' in ($1, $2)", params: ["${childName}", "${childName} ES"] }

# Examples limited to countries: the admin shows an example of a story of its own (no template) in
# Kazakhstan only, and the API and the home page show it there and hide it in Germany and for
# "other". An example with no countries of its own follows its template's, which «Examples» shows as
# the inherited value. Everything is reset at the end.
appId: ${WEB}
tags: [examples, i18n, admin]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Пример страны ${Date.now()}"
  slug: bath-time
  # The test-only admin account from e2e/start-stack.sh.
  adminEmail: admin@e2e.test
  adminPassword: e2e-admin-password
http:
  baseUrl: ${API}
  headers:
    X-Client-Key: "e2e-example-countries-${childName}"
    X-Demo-Code: E2E-DEMO
before:
  # The template's book is listed in Germany only, so its example follows it there.
  - sql: { exec: "update \"BookTemplate\" set countries = '{DE}' where slug = $1", params: ["${slug}"] }
commands:
  # Two finished (mock) books: a story of its own, and one from the template.
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 6, gender: girl, interests: [наурыз], city: Алматы, language: ru }
      extract: { plainId: "$.id" }
      assert: { status: 201 }
  - request:
      method: POST
      url: /books
      json:
        child: { name: "${childName}", age: 3, gender: boy, interests: [утята], city: Алматы, language: ru }
        template: ${slug}
        answers: { toy: резиновый утёнок }
      extract: { templatedId: "$.id" }
      assert: { status: 201 }
  - request:
      url: /books/${plainId}
      retryUntil:
        status: 200
        json: { "$.status": done }
      timeout: 30000
  - request:
      url: /books/${templatedId}
      retryUntil:
        status: 200
        json: { "$.status": done }
      timeout: 30000

  # The admin makes both examples; neither has countries of its own yet.
  - request:
      method: POST
      url: /admin/login
      json: { email: "${adminEmail}", password: "${adminPassword}" }
      assert: { status: 204 }
  - request:
      method: POST
      url: /admin/examples
      json: { bookId: "${plainId}" }
      extract: { plainExample: "$.id" }
      assert: { status: 201, json: { "$.templateCountries": null } }
  - request:
      method: POST
      url: /admin/examples
      json: { bookId: "${templatedId}" }
      extract: { templatedExample: "$.id" }
      assert: { status: 201 }

  # Only real codes of countries the site offers.
  - request:
      method: PATCH
      url: /admin/examples/${plainExample}
      json: { countries: [XX] }
      assert: { status: 400 }
  - request:
      method: PATCH
      url: /admin/examples/${plainExample}
      json: { countries: [other] }
      assert: { status: 400 }
  - request:
      method: PATCH
      url: /admin/examples/${plainExample}
      json: { countries: [FR] }
      assert: { status: 400, json: { "$.code": example_country_unknown } }
  - request:
      method: PATCH
      url: /admin/examples/${plainExample}
      json: {}
      assert: { status: 400 }

  # Before: the book of its own is shown everywhere, the template's one only in Germany.
  - evalScript: >-
      output.examples = (country) => json(http.get(API + '/books/examples?lang=ru' + (country ? '&country=' + country : '')).body).map((b) => b.id);
      output.de = output.examples('DE'); output.kz = output.examples('KZ')
  - assertTrue: ${output.de.includes(plainId) && output.de.includes(templatedId)}
  - assertTrue: ${output.kz.includes(plainId) && !output.kz.includes(templatedId)}

  # «Examples»: the template's example shows its template's country as the inherited value.
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/admin/login"
  - waitForVisible: { testId: admin-login }
  - tapOn: { testId: admin-email }
  - inputText: "${adminEmail}"
  - tapOn: { testId: admin-password }
  - inputText: "${adminPassword}"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: admin-nav-inbox }
  - tapOn: { testId: admin-nav-examples }
  - waitForVisible: { css: "[data-testid='example-${templatedExample}-countries'][data-loaded=true]" }
  - assertVisible: { testId: "example-${templatedExample}-countries-inherited", contains: "As its template" }
  - assertVisible: { testId: "example-${templatedExample}-countries-inherited", contains: "Germany" }

  # The story of its own: everywhere, until the admin picks Kazakhstan.
  - assertVisible: { testId: "example-${plainExample}-countries-inherited", text: "All countries" }
  - tapOn: { testId: "example-${plainExample}-country-add" }
  - waitForVisible: { testId: "example-${plainExample}-country-menu" }
  - tapOn: { testId: "example-${plainExample}-country-option-KZ" }
  - waitForVisible: { testId: "example-${plainExample}-country-KZ" }
  - assertVisible: { text: "Kazakhstan", childOf: { testId: "example-${plainExample}-country-KZ" } }
  - waitForVisible: { css: "[data-testid='example-${plainExample}-countries'][data-value=KZ]" }
  - assertNotVisible: { testId: "example-${plainExample}-countries-inherited" }
  - sql:
      query: "select array_to_string(countries, ',') as countries from \"Example\" where id = $1"
      params: ["${plainExample}"]
      readOnly: true
      assert:
        first: { countries: KZ }
  - openLink: "${WEB}/admin/examples"
  - waitForVisible: { testId: "example-${plainExample}-country-KZ" }

  # The API: shown in Kazakhstan; not in Germany, for "other", an unknown code or with no country.
  - evalScript: >-
      output.kz = output.examples('KZ'); output.de = output.examples('DE');
      output.other = output.examples('other'); output.unknown = output.examples('XX'); output.none = output.examples('')
  - assertTrue: ${output.kz.includes(plainId)}
  - assertTrue: ${!output.de.includes(plainId)}
  - assertTrue: ${!output.other.includes(plainId)}
  - assertTrue: ${!output.unknown.includes(plainId)}
  - assertTrue: ${!output.none.includes(plainId)}
  # The template's book still follows its template.
  - assertTrue: ${output.de.includes(templatedId) && !output.kz.includes(templatedId)}

  # The home page with no country cookie: the test browser's (local) address gives "other", where
  # neither book is shown.
  - launchApp: { appId: "${WEB}", clearState: true }
  - openLink: "${WEB}/ru"
  - waitForVisible: { testId: hero-covers }
  - assertVisible: { testId: ui-country, contains: "Другая страна" }
  - assertNotVisible: { testId: "example-${plainId}" }
  - assertNotVisible: { testId: "example-${templatedId}" }
  # Kazakhstan, picked in the footer: the book of its own is there.
  - runFlow: ../helpers/kazakhstan.helper.yaml
  - openLink: "${WEB}/ru"
  - waitForVisible: { testId: hero-covers }
  - assertVisible: { testId: ui-country, contains: "Казахстан" }
  - waitForVisible: { testId: "example-${plainId}" }
  - assertNotVisible: { testId: "example-${templatedId}" }

  # Germany (picked in the footer of the shorter catalog page, as a tap far down the long home page
  # can miss), which turns the site German: neither example has a German version, so neither shows.
  - openLink: "${WEB}/ru/catalog"
  - waitForVisible: { testId: template-first-day-kindergarten }
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-search }
  - inputText: "Герм"
  - waitForVisible: { testId: ui-country-option-DE }
  - tapOn: { testId: ui-country-option-DE }
  - waitForVisible: "Buchkatalog"
  - tapOn: { testId: nav-home }
  - waitForVisible: { testId: hero-covers }
  - assertNotVisible: { testId: "example-${templatedId}" }
  - assertNotVisible: { testId: "example-${plainId}" }
  # The Russian page in Germany: the template's book comes in, the book about Nauryz goes.
  - openLink: "${WEB}/ru"
  - waitForVisible: { testId: hero-covers }
  - waitForVisible: { testId: "example-${templatedId}" }
  - assertVisible: "Примеры книг"
  - assertNotVisible: { testId: "example-${plainId}" }

  # Another country: neither (picked on the Russian catalog page, which the address keeps Russian;
  # down to the footer first, as a tap right away can land while the page still streams in).
  - openLink: "${WEB}/ru/catalog"
  - waitForVisible: { testId: template-first-day-kindergarten }
  - scrollUntilVisible: { testId: ui-country }
  - tapOn: { testId: ui-country }
  - waitForVisible: { testId: ui-country-search }
  - tapOn: { testId: ui-country-option-other }
  - waitForVisible: { testId: ui-country, contains: "Другая страна" }
  - tapOn: { testId: nav-home }
  - waitForVisible: { testId: hero-covers }
  - assertNotVisible: { testId: "example-${templatedId}" }
  - assertNotVisible: { testId: "example-${plainId}" }

  # The admin takes Kazakhstan off again: everywhere.
  - openLink: "${WEB}/admin/login"
  - waitForVisible: { testId: admin-login }
  - tapOn: { testId: admin-email }
  - inputText: "${adminEmail}"
  - tapOn: { testId: admin-password }
  - inputText: "${adminPassword}"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: admin-nav-inbox }
  - openLink: "${WEB}/admin/examples"
  - waitForVisible: { testId: "example-${plainExample}-country-KZ" }
  - tapOn: { testId: "example-${plainExample}-country-remove-KZ" }
  - waitForVisible: { testId: "example-${plainExample}-countries-inherited", text: "All countries" }
  - waitForVisible: { css: "[data-testid='example-${plainExample}-countries'][data-value='']" }
  - sql:
      query: "select cardinality(countries) as n from \"Example\" where id = $1"
      params: ["${plainExample}"]
      readOnly: true
      assert:
        first: { n: 0 }
  - evalScript: "output.de = output.examples('DE')"
  - assertTrue: ${output.de.includes(plainId)}
after:
  - sql: { exec: "update \"BookTemplate\" set countries = '{}' where slug = $1", params: ["${slug}"] }
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }
  - sql: { exec: "delete from \"Example\" e where not exists (select 1 from \"ExampleVersion\" v where v.\"exampleId\" = e.id)" }

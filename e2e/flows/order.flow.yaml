# A finished book is ordered in print: price, demo payment, delivery timeline; only its owner can.
appId: ${WEB}
tags: [smoke, order]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  childName: "Заказ ${Date.now()}"
  email: "order+${Date.now()}@e2e.test"
commands:
  # Ordering is allowed only from the browser the book belongs to, so the book is made here.
  - launchApp: { appId: "${WEB}", clearState: true }
  # The test browser's address has no country: the visitor picks Kazakhstan (tenge, print).
  - runFlow: ../helpers/kazakhstan.helper.yaml
  - openLink: "${WEB}/ru/create"
  - runFlow: ../helpers/fill-by-hand.helper.yaml
  - tapOn: { testId: child-name }
  - inputText: "${childName}"
  - tapOn: { testId: child-interests }
  - inputText: "динозавры"
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: wizard-next }
  - tapOn: { testId: create-book }
  - waitForVisible: { text: "Книга готова", timeout: 30000 }
  - tapOn: { testId: order-print }
  - waitForVisible: { testId: order-form }
  - tapOn: { testId: cover-hard }
  - selectOption: { testId: quantity, option: "2" }
  - selectOption: { testId: city, option: "Шымкент" }
  - assertVisible: { text: "31 300 ₸" }
  - tapOn: { testId: recipient-name }
  - inputText: "Айгерим Сапарова"
  - tapOn: { testId: phone }
  - inputText: "701 123 45 67"
  - tapOn: { testId: order-email }
  - inputText: "${email}"
  - tapOn: { testId: address }
  - inputText: "ул. Абая, 10, кв. 5"
  - tapOn: { testId: place-order }
  - waitForVisible: { text: "Заказ оформлен", timeout: 10000 }
  # The confirmation goes to the typed address (AUTH_MOCK keeps unsent mails for the test).
  - request:
      url: "${API}/test/mails"
      query: { to: "${email}" }
      retryUntil: { status: 200, json: { "$[0].subject": { contains: "принят" } } }
      timeout: 10000
  - waitForVisible: { text: "Доставлен", timeout: 15000 }
  - assertVisible: { text: "Итого: 31 300 ₸" }
  # The order's lines as priced when ordered, in tenge.
  - assertVisible: { css: "[data-testid=order-line][data-currency=KZT][data-unit='1490000'][data-total='2980000']" }
  - sql:
      query: >-
        select o.cover::text as cover, o.quantity, o."totalAmount" as total, o.currency, o."deliveryAmount" as delivery, o.phone, o.email = $2 as email, o.locale,
        o.city, o."cityId" as city_id
        from "Order" o join "Book" b on b.id = o."bookId" where b.child->>'name' = $1
      params: ["${childName}", "${email}"]
      readOnly: true
      assert:
        rows: 1
        first: { cover: hard, quantity: 2, total: 3130000, currency: KZT, delivery: 150000, phone: "+77011234567", email: true, locale: ru, city: Шымкент, city_id: shymkent }
after:
  - sql: { exec: "delete from \"Book\" where child->>'name' = $1", params: ["${childName}"] }

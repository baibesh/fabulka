# Reference data in the admin («Reference data»): the owner changes the catalog book price without
# touching code, and the book page and the checkout use it; adds a delivery city; adds a country to
# the site's list (in its own currency) and takes it off again (a Meta-blocked one is refused); edits
# the home page FAQ and adds a question for Kazakhstan only; blocks one more
# country on top of Meta's list, which stays read-only and can never be unblocked. Everything is
# put back afterwards, so the flows that check «1 900 ₸» keep passing. Prices are per currency.
appId: ${WEB}
tags: [admin, reference]
db: ${DATABASE_URL}
params:
  DATABASE_URL:
    required: true
    description: Postgres DSN of the e2e database (e2e/.env)
env:
  clientKey: "e2e-reference-${Date.now()}"
  # The test-only admin account from e2e/start-stack.sh.
  adminEmail: admin@e2e.test
  adminPassword: e2e-admin-password
  # RIPE NCC, in the Netherlands by the DB-IP database: not blocked until the owner adds NL.
  dutchIp: 193.0.6.139
commands:
  - launchApp: { appId: "${WEB}", clearState: true }
  # The test browser's address has no country: the visitor picks Kazakhstan (tenge, print).
  - runFlow: ../helpers/kazakhstan.helper.yaml
  - openLink: "${WEB}/ru"
  # The hero's covers render only after hydration, by when the page has saved the language.
  - waitForVisible: { testId: hero-covers }
  - openLink: "${WEB}/admin/login"
  - waitForVisible: { testId: admin-login }
  - tapOn: { testId: admin-email }
  - inputText: "${adminEmail}"
  - tapOn: { testId: admin-password }
  - inputText: "${adminPassword}"
  - tapOn: { testId: admin-submit }
  - waitForVisible: { testId: admin-nav-inbox }
  - tapOn: { testId: admin-nav-settings }
  - waitForVisible: { testId: settings-tabs }
  - assertVisible: "Settings"
  - tapOn: { testId: settings-tab-prices }
  - waitForVisible: { testId: reference-prices }
  - assertUrl: { contains: "/admin/settings?tab=prices" }

  # Global's default prices: one list per currency. A dollar price in fractions of a cent is
  # pointed out next to its field, and nothing is saved.
  - assertVisible: { css: "[data-testid=reference-prices][data-currency=EUR]" }
  - tapOn: { css: "[data-testid=reference-prices][data-currency=USD] [data-testid=price-template]" }
  - eraseText
  - inputText: "4.999"
  - tapOn: { testId: prices-save-USD }
  - waitForVisible: { css: "[data-testid=reference-prices][data-currency=USD] [data-testid=reference-error]", contains: "at most two decimals" }
  - request:
      url: ${API}/reference
      assert: { status: 200, json: { "$.prices.USD.books.template": 390 } }

  # Fixed and saved: the public reference data has the new price at once (in cents).
  - tapOn: { css: "[data-testid=reference-prices][data-currency=USD] [data-testid=price-template]" }
  - eraseText
  - inputText: "4.90"
  - tapOn: { testId: prices-save-USD }
  - waitForVisible: { css: "[data-testid=reference-prices][data-currency=USD] [data-testid=reference-saved]" }
  # Tenge are whole: typed with a space, kept in tiyn.
  - tapOn: { css: "[data-testid=reference-prices][data-currency=KZT] [data-testid=price-template]" }
  - eraseText
  - inputText: "2 450"
  - tapOn: { testId: prices-save-KZT }
  - waitForVisible: { css: "[data-testid=reference-prices][data-currency=KZT] [data-testid=reference-saved]" }
  - assertNotVisible: { testId: reference-error }
  - request:
      url: ${API}/reference
      assert:
        status: 200
        json: { "$.prices.KZT.books.template": 245000, "$.prices.USD.books.template": 490, "$.prices.KZT.books.custom": 290000, "$.prices.EUR.books.template": 390 }

  # A new delivery city with free delivery, in three languages: cities are a country's, so the
  # admin switches to Kazakhstan's workspace first (Settings is Global's: it lands on the Inbox).
  - tapOn: { testId: workspace-switcher }
  - tapOn: { testId: workspace-option-KZ }
  - waitForVisible: { css: "[data-testid=workspace-switcher][data-value=KZ]" }
  - waitForVisible: { css: "[data-testid=inbox-page][data-country=KZ]" }
  - assertUrl: { contains: "/admin?country=KZ" }
  - tapOn: { testId: admin-nav-cities }
  - assertUrl: { contains: "/admin/cities?country=KZ" }
  - waitForVisible: { css: "[data-testid=reference-cities][data-country=KZ]" }
  - assertVisible: { css: "[data-testid=city-row][data-id=almaty]" }
  - tapOn: { testId: city-add }
  - tapOn: { css: "[data-testid=city-row]:last-child [data-testid=city-ru]" }
  - inputText: "Туркестан"
  - tapOn: { css: "[data-testid=city-row]:last-child [data-testid=city-kk]" }
  - inputText: "Түркістан"
  - tapOn: { css: "[data-testid=city-row]:last-child [data-testid=city-en]" }
  - inputText: "Turkistan"
  - tapOn: { css: "[data-testid=city-row]:last-child [data-testid=city-free]" }
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-saved }
  - request:
      url: ${API}/reference
      assert:
        status: 200
        json: { "$.cities[10].id": turkestan, "$.cities[10].name.ru": Туркестан, "$.cities[10].name.kk": Түркістан, "$.cities[10].freeDelivery": true }
  # The id is made from the Russian name on the first save and shown in the admin.
  - waitForVisible: { css: "[data-testid=city-row][data-id=turkestan]" }

  # The book page shows the new price.
  - openLink: "${WEB}/ru/catalog/first-day-kindergarten"
  - waitForVisible: { testId: template-title }
  - waitForVisible: { text: "2 450 ₸", childOf: { testId: book-price } }

  # The checkout records the owner's price, whatever the client sends (in Kazakhstan, as chosen on
  # the site: a local address alone would be "other").
  - request:
      method: POST
      url: ${API}/quota/purchase
      headers: { X-Client-Key: "${clientKey}", X-Country: KZ }
      json: { kind: template, amount: 1 }
      assert: { status: "2xx" }
  - sql:
      query: select amount as price, currency from "Credit" where "clientKey" = $1
      params: ["${clientKey}"]
      readOnly: true
      assert: { rows: 1, first: { price: 245000, currency: KZT } }
  # From a country priced in dollars (chosen on the site), the dollar price.
  - request:
      method: POST
      url: ${API}/quota/purchase
      headers: { X-Client-Key: "${clientKey}-us", X-Country: US }
      json: { kind: template }
      assert: { status: "2xx" }
  - sql:
      query: select amount, currency, "fxToUsd"::text as fx from "Credit" where "clientKey" = $1
      params: ["${clientKey}-us"]
      readOnly: true
      assert: { rows: 1, first: { amount: 490, currency: USD } }

  # Countries: Portugal added (it starts in euros, English, priced from the euro defaults), offered on
  # the site, then taken off again.
  - openLink: "${WEB}/admin/settings?tab=countries"
  - waitForVisible: { testId: settings-tabs }
  - waitForVisible: { testId: reference-countries }
  - assertVisible: { css: "[data-testid=country-row][data-code=KZ]" }
  - assertVisible: { testId: country-other }
  # The list is long: bring its end (the plain "another country" row, the picker under it) into view.
  - tapOn: { testId: country-other }
  - scrollUntilVisible: { testId: country-add-select, centerElement: true }
  - selectOption: { testId: country-add-select, optionValue: PT }
  - tapOn: { testId: country-add }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT]" }
  - assertVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-currency][data-value=EUR]" }
  - assertVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-default-prices]", contains: "€3.90 / €5.90" }
  # A payment provider that is not wired in yet says so; Portugal stays paid by hand.
  - selectOption: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-payment]", optionValue: stripe }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-payment-not-live]" }
  - selectOption: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-payment]", optionValue: manual }
  - assertNotVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-payment-not-live]" }
  # Languages are chips: + lists only the ones not added yet. Russian, then Spanish.
  - tapOn: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-add]" }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-option-ru]" }
  - assertNotVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-option-en]" }
  - tapOn: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-option-ru]" }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-ru]" }
  - tapOn: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-add]" }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-option-es]" }
  - tapOn: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-option-es]" }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-es]" }
  # Shown in the usual order, English first and Russian last, whichever is the default.
  - assertVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-lang-en] + [data-testid=country-lang-es] + [data-testid=country-lang-ru]" }
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-saved }
  - assertNotVisible: { testId: reference-error }
  - request:
      url: ${API}/reference
      assert:
        status: 200
        json: { "$.countries[0].code": KZ, "$.countries[9].code": PT, "$.countries[9].languages[0]": en, "$.countries[9].languages[2]": es, "$.countries[9].currency": EUR }
  - openLink: "${WEB}/ru/catalog"
  - waitForVisible: { testId: template-first-day-kindergarten }
  - scrollUntilVisible: { testId: ui-country }
  - tapOn: { testId: ui-country }
  - tapOn: { testId: ui-country-search }
  - inputText: "Португ"
  - waitForVisible: { testId: ui-country-option-PT }
  - tapOn: { testId: ui-country-option-PT }
  - waitForVisible: { testId: ui-country, contains: "Португалия" }
  # English is Portugal's default, so the Russian interface stays only because Portugal offers it.
  - tapOn: { testId: ui-language }
  - waitForVisible: { testId: ui-language-option-ru }
  - assertNotVisible: { testId: ui-language-option-kk }
  - pressKey: escape
  # A Meta-blocked country can never be offered, not even through the API.
  - request:
      method: POST
      url: ${API}/admin/login
      json: { email: "${adminEmail}", password: "${adminPassword}" }
      assert: { status: 204 }
  - request:
      method: PUT
      url: ${API}/admin/reference/countries
      json:
        - { code: KZ, languages: [kk, ru, en], currency: KZT, print: true }
        - { code: RU, languages: [ru], currency: USD, print: false }
      assert: { status: 400, json: { "$.code": country_policy_blocked, "$.countries[0]": RU } }
  # Taken off in the admin: the site no longer offers it, and a visitor who chose it is "other".
  - openLink: "${WEB}/admin/settings?tab=countries"
  - waitForVisible: { testId: settings-tabs }
  - waitForVisible: { css: "[data-testid=country-row][data-code=PT]" }
  # Portugal is the last of the rows.
  - scrollUntilVisible: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-remove]", centerElement: true }
  - tapOn: { css: "[data-testid=country-row][data-code=PT] [data-testid=country-remove]" }
  - assertNotVisible: { css: "[data-testid=country-row][data-code=PT]" }
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-saved }
  - openLink: "${WEB}/ru/catalog"
  - waitForVisible: { testId: template-first-day-kindergarten }
  - waitForVisible: { testId: ui-country, contains: "Другая страна" }
  - scrollUntilVisible: { testId: ui-country }
  - tapOn: { testId: ui-country }
  - tapOn: { testId: ui-country-search }
  - inputText: "Португ"
  - waitForVisible: { contains: "Такой страны нет в списке" }
  - assertNotVisible: { testId: ui-country-option-PT }
  - pressKey: escape

  # FAQ: an answer edited and a question for Kazakhstan only, both on the home page.
  - openLink: "${WEB}/admin/faq"
  - waitForVisible: { testId: reference-faq }
  # Print answers follow the country's print flag, not a list of countries.
  - scrollUntilVisible: { css: "[data-testid=faq-row][data-id=print-abroad]", centerElement: true }
  - assertVisible: { css: "[data-testid=faq-row][data-id=print-kz]", containsDescendants: { text: "Countries with print" } }
  - assertVisible: { css: "[data-testid=faq-row][data-id=print-abroad]", containsDescendants: { text: "Countries without print" } }
  - tapOn: { css: "[data-testid=faq-row][data-id=account] [data-testid=faq-toggle]" }
  - tapOn: { css: "[data-testid=faq-row][data-id=account] [data-testid=faq-a-ru]" }
  - eraseText
  - inputText: "Нет, регистрация не нужна: книги ждут вас в разделе «Мои книги»."
  - tapOn: { testId: faq-add }
  - tapOn: { css: "[data-testid=faq-row]:last-child [data-testid=faq-q-ru]" }
  - inputText: "Есть ли подарочная упаковка?"
  - tapOn: { css: "[data-testid=faq-row]:last-child [data-testid=faq-a-ru]" }
  - inputText: "Пока нет, но мы над этим думаем."
  # English is required too: pointed out, nothing saved.
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-error, contains: "A question is needed" }
  - tapOn: { css: "[data-testid=faq-row]:last-child [data-testid=faq-q-en]" }
  - inputText: "Is there gift wrapping?"
  - tapOn: { css: "[data-testid=faq-row]:last-child [data-testid=faq-a-en]" }
  - inputText: "Not yet, but we are thinking about it."
  - selectOption: { css: "[data-testid=faq-row]:last-child [data-testid=faq-audience]", optionValue: only }
  - tapOn: { css: "[data-testid=faq-row]:last-child [data-testid=faq-country-KZ]" }
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-saved }
  - assertNotVisible: { testId: reference-error }
  - openLink: "${WEB}/ru"
  - waitForVisible: { testId: hero-covers }
  - tapOn: "Нужно ли регистрироваться?"
  - waitForVisible: { contains: "Нет, регистрация не нужна: книги ждут вас" }
  - assertNotVisible: "Есть ли подарочная упаковка?"
  # In Kazakhstan the new question shows, in English too since it has an English text.
  - tapOn: { testId: nav-catalog }
  - waitForVisible: { testId: template-first-day-kindergarten }
  - scrollUntilVisible: { testId: ui-country }
  - tapOn: { testId: ui-country }
  - tapOn: { testId: ui-country-option-KZ }
  - waitForVisible: { testId: ui-country, contains: "Казахстан" }
  - tapOn: { testId: nav-home }
  - waitForVisible: { testId: hero-covers }
  - tapOn: "Есть ли подарочная упаковка?"
  - waitForVisible: "Пока нет, но мы над этим думаем."
  - tapOn: { testId: ui-language }
  - tapOn: { testId: ui-language-option-en }
  - waitForVisible: "Is there gift wrapping?"

  # Blocked countries: Meta's list is read-only, with nothing to remove.
  - openLink: "${WEB}/admin/settings?tab=blocked"
  - waitForVisible: { testId: settings-tabs }
  - waitForVisible: { testId: blocked-meta }
  - assertVisible: { css: "[data-testid=blocked-meta-row][data-code=RU]" }
  - assertVisible: { css: "[data-testid=blocked-meta-row][data-code=IN]" }
  - assertNotVisible: { css: "[data-testid=blocked-meta] button" }
  - assertVisible: { contains: "No extra countries", childOf: { testId: blocked-extra } }
  # A Meta country cannot be added as one of the owner's, an unknown code is refused.
  - tapOn: { testId: blocked-input }
  - inputText: "RU"
  - tapOn: { testId: blocked-add }
  - waitForVisible: { testId: reference-error, contains: "policy blocks this country already" }
  - tapOn: { testId: blocked-input }
  - eraseText
  - inputText: "QQ"
  - tapOn: { testId: blocked-add }
  - waitForVisible: { testId: reference-error, contains: "ISO 3166" }
  # The Netherlands, added and saved: listed, and turned away by the API.
  - tapOn: { testId: blocked-input }
  - eraseText
  - inputText: "nl"
  - tapOn: { testId: blocked-add }
  - waitForVisible: { css: "[data-testid=blocked-row][data-code=NL]" }
  - tapOn: { testId: reference-save }
  - waitForVisible: { testId: reference-saved }
  - request:
      url: ${API}/templates
      headers: { X-Real-IP: "${dutchIp}" }
      assert: { status: 451, json: { "$.code": region_unavailable, "$.country": NL } }

  # Through the API too, Meta's list cannot be touched: a Meta code is refused, and emptying the
  # owner's list unblocks only the owner's countries.
  - request:
      method: POST
      url: ${API}/admin/login
      json: { email: "${adminEmail}", password: "${adminPassword}" }
      assert: { status: 204 }
  - request:
      method: PUT
      url: ${API}/admin/reference/blocked
      json: { extra: [NL, RU] }
      assert: { status: 400, json: { "$.code": country_policy_blocked } }
  - request:
      method: PUT
      url: ${API}/admin/reference/blocked
      json: { extra: [] }
      assert: { status: 200 }
  - request:
      url: ${API}/templates
      headers: { X-Real-IP: 77.88.8.8 }
      assert: { status: 451, json: { "$.country": RU } }
  - request:
      url: ${API}/templates
      headers: { X-Real-IP: "${dutchIp}" }
      assert: { status: 200 }
  - openLink: "${WEB}/admin/settings?tab=blocked"
  - waitForVisible: { testId: settings-tabs }
  - waitForVisible: { contains: "No extra countries", childOf: { testId: blocked-extra } }
  - assertVisible: { css: "[data-testid=blocked-meta-row][data-code=RU]" }
after:
  # The seeded FAQ again: without its row the API serves the defaults once a save below drops its cache.
  - sql: { exec: "delete from \"Setting\" where key = 'reference.faq'" }
  # Today's prices, cities, countries and no extra countries again, through the API so its cache is
  # dropped.
  - request:
      method: POST
      url: ${API}/admin/login
      json: { email: "${adminEmail}", password: "${adminPassword}" }
  - request:
      method: PUT
      url: ${API}/admin/reference/prices
      json: { currency: KZT, books: { template: 190000, custom: 290000 } }
      assert: { status: 200 }
  - request:
      method: PUT
      url: ${API}/admin/reference/prices
      json: { currency: USD, books: { template: 390, custom: 590 } }
      assert: { status: 200 }
  - request:
      method: PUT
      url: ${API}/admin/reference/cities
      json:
        - { id: almaty, name: { ru: Алматы, kk: Алматы, en: Almaty }, freeDelivery: true }
        - { id: astana, name: { ru: Астана, kk: Астана, en: Astana }, freeDelivery: true }
        - { id: shymkent, name: { ru: Шымкент, kk: Шымкент, en: Shymkent }, freeDelivery: false }
        - { id: karaganda, name: { ru: Караганда, kk: Қарағанды, en: Karaganda }, freeDelivery: false }
        - { id: aktobe, name: { ru: Актобе, kk: Ақтөбе, en: Aktobe }, freeDelivery: false }
        - { id: taraz, name: { ru: Тараз, kk: Тараз, en: Taraz }, freeDelivery: false }
        - { id: pavlodar, name: { ru: Павлодар, kk: Павлодар, en: Pavlodar }, freeDelivery: false }
        - { id: ust-kamenogorsk, name: { ru: Усть-Каменогорск, kk: Өскемен, en: Oskemen }, freeDelivery: false }
        - { id: atyrau, name: { ru: Атырау, kk: Атырау, en: Atyrau }, freeDelivery: false }
        - { id: kostanay, name: { ru: Костанай, kk: Қостанай, en: Kostanay }, freeDelivery: false }
      assert: { status: 200 }
  - request:
      method: PUT
      url: ${API}/admin/reference/blocked
      json: { extra: [] }
      assert: { status: 200 }
  - request:
      method: PUT
      url: ${API}/admin/reference/countries
      json:
        - { code: KZ, languages: [kk, ru, en], currency: KZT, print: true }
        - { code: US, languages: [en], currency: USD, print: false }
        - { code: CA, languages: [en], currency: CAD, print: false }
        - { code: MY, languages: [en], currency: MYR, print: false }
        - { code: AU, languages: [en], currency: AUD, print: false }
        - { code: DE, languages: [de, en], currency: EUR, print: false }
        - { code: AT, languages: [de, en], currency: EUR, print: false }
        - { code: CH, languages: [de, en], currency: CHF, print: false }
        - { code: ES, languages: [es, en], currency: EUR, print: false }
      assert: { status: 200 }
  - sql: { exec: "delete from \"Credit\" where \"clientKey\" in ($1, $1 || '-us')", params: ["${clientKey}"] }
